  <style>
    /* ───── AEX Design System Typography ───── */
    body {
      font-family: 'Inter', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', sans-serif;
    }

    .font-accent {
      font-family: 'Playfair Display', serif;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #ebedea;
    }

    ::-webkit-scrollbar-thumb {
      background: #3F556B;
    }

    @keyframes animationIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(8px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
    }

    .animate-on-scroll {
      animation-play-state: paused !important;
    }

    .animate-on-scroll.animate {
      animation-play-state: running !important;
    }

    html,
    body {
      overflow-x: hidden !important;
      min-height: 100% !important;
      scroll-behavior: auto !important;
    }

    /* ───── Abstract Editorial Background ───── */
    .hero-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bg-base {
      position: absolute;
      inset: 0;
      background: #ebedea;
    }

    .bg-layers {
      position: absolute;
      inset: 0;
      filter: blur(60px);
    }

    .layer {
      position: absolute;
      border-radius: 50%;
      opacity: 0.7;
      mix-blend-mode: multiply;
    }

    .layer-1 {
      width: 600px;
      height: 600px;
      background: #f2f2f2;
      top: 10%;
      left: 15%;
      animation: float1 28s ease-in-out infinite alternate;
    }

    .layer-2 {
      width: 500px;
      height: 500px;
      background: #eaeaea;
      top: 40%;
      left: 55%;
      animation: float2 32s ease-in-out infinite alternate;
    }

    .layer-3 {
      width: 700px;
      height: 700px;
      background: #f5f5f5;
      top: 60%;
      left: 20%;
      animation: float3 36s ease-in-out infinite alternate;
    }

    @keyframes float1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.05); }
    }

    @keyframes float2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-30px, 40px) scale(1.08); }
    }

    @keyframes float3 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(20px, 30px) scale(1.04); }
    }

    .bg-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.055;
      mix-blend-mode: multiply;
    }

    /* ── Pulsing placeholder dot ── */
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.6; }
      70% { transform: scale(1.3); opacity: 0; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .blink-dot {
      animation: blink-dot 2s ease-in-out infinite;
    }
  </style>
</head>

  <script>
    // In-View Animation Observer
    (function () {
      const once = true;
      if (!window.__inViewIO) {
        window.__inViewIO = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("animate");
              if (once) window.__inViewIO.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: "0px 0px -10% 0px" });
      }
      window.initInViewAnimations = function (selector = ".animate-on-scroll") {
        document.querySelectorAll(selector).forEach((el) => {
          window.__inViewIO.observe(el);
        });
      };
      document.addEventListener("DOMContentLoaded", () => initInViewAnimations());
    })();

    // Editorial Grain
    const canvas = document.querySelector('.bg-noise');
    if (canvas) {
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth / 2;
        canvas.height = window.innerHeight / 2;
      }

      function generateNoise() {
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 255;
          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
          data[i + 3] = 30;
        }
        ctx.putImageData(imageData, 0, 0);
      }

      resizeCanvas();
      generateNoise();
      window.addEventListener('resize', () => { resizeCanvas(); generateNoise(); });
    }
  </script>
