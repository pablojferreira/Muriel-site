<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth bg-[#050807] text-white antialiased">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Narrativas de Alto Padrão | Documentários de Marca</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- GSAP & Lenis via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
  <script src="https://unpkg.com/split-type"></script>

  <!-- Tooling -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ───── Tokens core da Aurora Design System ───── */
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', 'Courier New', monospace;
    }
    body { 
      font-family: var(--font-sans); 
      overflow-x: hidden;
    }
    .mono { font-family: var(--font-mono); }

    /* ───── Utilitários Visuais ───── */
    .glow-text { text-shadow: 0 0 20px rgba(182, 255, 60, 0.55), 0 0 60px rgba(0,255,198,0.15); }
    .glow-text-soft { text-shadow: 0 0 28px rgba(255,255,255,0.12); }
    
    .glow-btn { box-shadow: 0 0 20px rgba(182, 255, 60, 0.4); }
    .glow-btn:hover { box-shadow: 0 0 32px rgba(182, 255, 60, 0.8), 0 0 64px rgba(182,255,60,0.25); }

    .glass-card { background: rgba(10, 25, 18, 0.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(182, 255, 60, 0.15); }
    
    /* ───── Backgrounds ───── */
    .cinematic-bg {
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,255,198,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(182,255,60,0.07) 0%, transparent 60%),
        radial-gradient(circle at center, #0B1410 0%, #050807 100%);
      background-size: 200% 200%;
      animation: subtlePan 22s ease infinite;
    }
    @keyframes subtlePan { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    /* O fundo de grid foi removido para usar um fundo orgânico e dinâmico */

    /* ───── Componentes & Animações CSS ───── */
    .sweep-overlay { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent); }

    .scanline::after {
      content:""; position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(to bottom, transparent 0%, rgba(182,255,60,0.035) 50%, transparent 100%);
      animation: scanline 8s linear infinite;
    }
    @keyframes scanline { 0% { transform: translateY(-100%);} 100% { transform: translateY(100%);} }

    /* ───── Wrapper do Video ───── */
    .video-wrapper {
      position: relative;
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 25px 60px -20px rgba(0,0,0,0.8), 0 0 80px -30px rgba(182,255,60,0.15);
      background: rgba(10,25,18,0.4);
    }
    .video-wrapper::before {
      content:""; position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(5,8,7,0.2) 0%, rgba(5,8,7,0.5) 100%);
      z-index: 10; pointer-events: none;
    }

    /* Ocultar elementos para animação do GSAP */
    .gsap-hide { opacity: 0; visibility: hidden; }

    /* Fix para o text-shadow expandido: reativando o fade-out inteligente isolado apenas no flanco esquerdo para proteger o Glow do "i", mantendo a direita impenetrável */
    .reveal-line-wrapper {
      padding: 0.4em 0 0.4em 0.8em;
      margin: -0.4em 0 -0.4em -0.8em;
      mask-image: 
        linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%),
        linear-gradient(to right, transparent 0%, black 5%, black 100%);
      mask-composite: intersect;
      -webkit-mask-image: 
        linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%),
        linear-gradient(to right, transparent 0%, black 5%, black 100%);
      -webkit-mask-composite: source-in;
    }

    /* Cinematic Background */
    .hero-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(
          circle at 30% 20%,
          #16171a 0%,
          #0b0b0c 40%,
          #050506 100%
        ),
        linear-gradient(
          120deg,
          #0b0b0c 0%,
          #111214 50%,
          #0a0a0b 100%
        );
    }
    
    .bg-light {
      position: absolute;
      width: 60%;
      height: 60%;
      top: 10%;
      left: 40%;
      background: radial-gradient(
        circle,
        rgba(120, 140, 255, 0.08) 0%,
        rgba(0, 0, 0, 0) 70%
      );
      filter: blur(80px);
      opacity: 0.6;
      animation: lightFloat 18s ease-in-out infinite alternate;
    }
    
    @keyframes lightFloat {
      0% {
        transform: translate(0px, 0px) scale(1);
      }
      100% {
        transform: translate(-40px, 30px) scale(1.1);
      }
    }
    
    .bg-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.05;
    }
  </style>
</head>
<body class="selection:bg-[#B6FF3C] selection:text-black">
  
  <main class="relative min-h-screen flex items-center pt-20 pb-16 overflow-hidden cinematic-bg scanline" id="hero">
    
    <!-- Cinematic Background -->
    <div class="hero-bg">
      <div class="bg-gradient"></div>
      <div class="bg-light"></div>
      <canvas class="bg-noise"></canvas>
    </div>

    <div class="max-w-[90rem] mx-auto px-6 lg:px-12 w-full relative z-10 grid lg:grid-cols-12 gap-10 lg:gap-12 xl:gap-16 items-center">
      
      <!-- Coluna da Esquerda: Textos (Ocupa 6 colunas para evitar o natural breaking de palavras como "Transformamos o") -->
      <div class="lg:col-span-6 flex flex-col items-start gap-5 z-20">
        
        <!-- Headline -->
        <h1 class="gsap-headline w-full font-semibold tracking-tighter leading-[1.05] text-white glow-text-soft m-0 whitespace-nowrap text-[clamp(1.5rem,3.4vw,3.5rem)]">
          Transformamos o<br />
          <span class="inline-block text-transparent bg-clip-text bg-gradient-to-r from-[#B6FF3C] via-white to-[#00FFC6] glow-text">impacto real</span> da sua<br />
          marca em narrativas<br />
          que geram valor<br />
          no tempo.
        </h1>
        
        <!-- Subtitle -->
        <p class="gsap-element text-base md:text-lg text-[#A0B3A8] font-light leading-relaxed max-w-[95%] m-0">
          Documentários e sistemas narrativos para marcas que desejam construir presença, inspirar confiança e consolidar legitimidade.
        </p>

        <!-- Botões -->
        <div class="gsap-element flex flex-col sm:flex-row items-center whitespace-nowrap gap-4 mt-2 w-full sm:w-auto">
          
          <!-- Primary CTA (Solid acid com shimmer) -->
          <a class="group relative px-6 md:px-7 py-3.5 rounded-full bg-[#B6FF3C] text-black text-xs sm:text-[13px] lg:text-sm font-semibold hover:scale-[1.03] transition-all glow-btn overflow-hidden flex items-center justify-center gap-2 w-full sm:w-auto" href="#diagnostico">
            <span class="tracking-wide">DIAGNOSTICAR MEU PROJETO</span>
            <div class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out bg-gradient-to-r from-transparent via-white/50 to-transparent skew-x-12"></div>
          </a>

          <!-- Secondary CTA (Ghost com sweep) -->
          <a class="group relative px-6 md:px-7 py-3.5 rounded-full border border-[#B6FF3C]/50 text-white text-xs sm:text-[13px] lg:text-sm font-medium hover:bg-[#B6FF3C]/10 transition-all overflow-hidden flex items-center justify-center gap-2 w-full sm:w-auto" href="#processo">
            <span class="tracking-wide">COMO FUNCIONA</span>
            <div class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out sweep-overlay skew-x-12"></div>
          </a>
        </div>
      </div>

      <!-- Coluna da Direita: Mídia -->
      <div class="lg:col-span-6 relative w-full z-10 flex items-center justify-center gsap-media">
        <!-- Floating orbital element decorator -->
        <div class="hidden xl:block absolute -top-5 -right-5 w-20 h-20 pointer-events-none z-20">
          <div class="absolute inset-0 rounded-full border border-[#B6FF3C]/20" style="animation: spin 18s linear infinite;"></div>
          <div class="absolute inset-2 rounded-full border border-[#00FFC6]/20" style="animation: spin 14s linear infinite reverse;"></div>
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-[#B6FF3C] glow-btn"></div>
        </div>

        <!-- Video Showreel -->
        <div class="w-full aspect-video video-wrapper group shadow-[0_25px_60px_-15px_rgba(0,0,0,0.8),0_0_80px_-20px_rgba(182,255,60,0.15)]">
          <!-- Play hint hover overlay -->
          <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-20 pointer-events-none">
            <div class="w-16 h-16 rounded-full glass-card flex items-center justify-center text-[#B6FF3C] scale-90 group-hover:scale-100 transition-transform duration-500">
               <iconify-icon icon="solar:play-circle-bold-duotone" width="32"></iconify-icon>
            </div>
          </div>
          
          <video 
            src="White_pen_writing.mp4" 
            class="w-full h-full object-cover relative z-0 transition-transform duration-[2.5s] ease-out group-hover:scale-[1.04]"
            autoplay loop muted playsinline>
          </video>
        </div>
      </div>

    </div>

    <!-- Scroll Hint bottom -->
    <div class="gsap-scroll-hint absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-60">
      <span class="text-[10px] uppercase tracking-widest text-[#A0B3A8] mono">Explore</span>
      <iconify-icon class="animate-bounce text-[#B6FF3C]" icon="solar:arrow-down-linear"></iconify-icon>
    </div>
  </main>

  <script>
    // Smooth Scroll System
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      gestureDirection: 'vertical',
      smooth: true,
      mouseMultiplier: 1,
      smoothTouch: false,
      touchMultiplier: 2,
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    document.addEventListener("DOMContentLoaded", () => {
      
      // Ocultar preventivamente para preparar a entrada
      gsap.set('.gsap-element', { y: 25, opacity: 0 });
      gsap.set('.gsap-scroll-hint', { opacity: 0 });
      gsap.set('.gsap-media', { scale: 0.94, opacity: 0, rotationX: 4, transformPerspective: 1000 });

      // Preparando text split para a headline (sem overflow hidden duro, mas sim o wrapper suave)
      const headline = new SplitType('.gsap-headline', { types: 'lines', lineClass: 'reveal-line-wrapper' });
      
      // Criar a estrutura interna de wrap para o efeito de "reveal a partir de baixo" das linhas
      headline.lines.forEach(line => {
        const span = document.createElement('span');
        span.style.display = 'inline-block';
        span.style.transform = 'translateY(110%)';
        span.style.opacity = '0';
        span.innerHTML = line.innerHTML;
        line.innerHTML = '';
        line.appendChild(span);
      });

      // Master Timeline
      const tl = gsap.timeline({ 
        defaults: { ease: "power3.out" },
        delay: 0.1
      });

      // 1. Reveal do Video
      tl.to('.gsap-media', {
        scale: 1,
        opacity: 1,
        rotationX: 0,
        duration: 1.6,
        ease: "power4.out"
      });

      // 2. Reveal da Headline (linhas subindo)
      const lineSpans = document.querySelectorAll('.gsap-headline .reveal-line-wrapper span');
      tl.to(lineSpans, {
        y: "0%",
        opacity: 1,
        duration: 1.1,
        stagger: 0.12,
        ease: "power4.out"
      }, "-=1.2");

      // 3. Stagger dos demais elementos (Eyebrow, Subtitle, Botões)
      tl.to('.gsap-element', {
        y: 0,
        opacity: 1,
        duration: 1,
        stagger: 0.15,
        ease: "power3.out"
      }, "-=0.8");

      // 4. Reveal do scroll hint
      tl.to('.gsap-scroll-hint', {
        opacity: 0.6,
        duration: 1
      }, "-=0.2");

    });
  </script>

  <!-- Cinematic Grain Noise -->
  <script>
    const canvas = document.querySelector('.bg-noise');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function renderNoise() {
      const imageData = ctx.createImageData(canvas.width, canvas.height);
      const buffer = new Uint32Array(imageData.data.buffer);

      for (let i = 0; i < buffer.length; i++) {
        const val = Math.random() * 255 | 0;
        buffer[i] =
          (255 << 24) | // alpha
          (val << 16) |
          (val << 8) |
          val;
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function loop() {
      renderNoise();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
