<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Audiovisual | Muriel Filmes</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lenis via CDN -->
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>

  <!-- Tooling -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Google Fonts for AEX Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet">

  <style>
    /* ───── AEX Design System Typography ───── */
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Oswald', sans-serif; }
    .font-accent { font-family: 'Playfair Display', serif; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #ebedea; }
    ::-webkit-scrollbar-thumb { background: #3F556B; }

    .animate-on-scroll {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s cubic-bezier(0.19, 1, 0.22, 1), transform 1s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .animate-on-scroll.animate {
      opacity: 1;
      transform: translateY(0);
    }

    html, body {
      overflow-x: hidden !important;
      min-height: 100% !important;
      scroll-behavior: auto !important;
    }
  </style>
</head>

<body class="bg-[#ebedea] text-[#2d322f] antialiased selection:bg-[#3F556B] selection:text-white overflow-x-hidden">

  <!-- Navegação Topo -->
  <header class="fixed top-0 inset-x-0 w-full border-b border-[#2d322f]/10 bg-[#ebedea]/60 backdrop-blur-xl z-50">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
      <!-- Logo Esquerda -->
      <div class="flex justify-start items-center">
        <a href="index.html" class="shrink-0 group flex items-center">
          <img src="Muriel_nome.png" alt="Muriel Logo"
            class="h-4 md:h-5 opacity-80 group-hover:opacity-100 transition-all duration-300 filter brightness-0">
        </a>
      </div>

      <!-- Links & Interações Direita -->
      <div class="flex justify-end items-center gap-10">
        <nav class="hidden md:flex justify-end gap-10">
          <a href="muriel-documenta.html" class="relative group text-xs font-bold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Documenta<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#pos" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Pós<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#casulo" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Casulo<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#quem-somos" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Quem Somos<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#contato" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Contato<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
        </nav>
        <button aria-label="Menu" class="md:hidden text-[#2d322f] hover:text-[#3F556B] transition-colors duration-300">
          <iconify-icon height="24" icon="solar:hamburger-menu-linear" width="24"></iconify-icon>
        </button>
      </div>
    </div>
  </header>

  <main class="relative min-h-screen w-full bg-[#ebedea] text-[#2d322f] overflow-hidden flex flex-col justify-center items-center">
    <!-- Place holder section -->
    <div class="text-center animate-on-scroll relative z-10">
      <iconify-icon icon="solar:videocamera-record-bold-duotone" width="80" class="text-[#3F556B] mb-8"></iconify-icon>
      <h1 class="font-display text-5xl md:text-7xl lg:text-8xl font-bold tracking-tighter uppercase mb-4 text-[#1e2420]">
        Pipeline <br><span class="font-accent italic text-[#3F556B] font-normal normal-case">Audiovisual</span>
      </h1>
      <p class="font-sans text-xl font-light text-[#2d322f]/70 mt-8 tracking-widest uppercase text-sm">Página em construção</p>
    </div>
  </main>

  <script>
    // Smooth Scroll System via Lenis
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      gestureDirection: 'vertical',
      smooth: true,
    });
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Intersection Observer
    document.addEventListener("DOMContentLoaded", () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("animate");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: "0px 0px -10% 0px" });

      document.querySelectorAll(".animate-on-scroll").forEach((el) => {
        observer.observe(el);
      });
    });
  </script>
</body>
</html>
