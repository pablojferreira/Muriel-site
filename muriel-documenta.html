<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muriel Documenta | Muriel Filmes</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lenis via CDN -->
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>

  <!-- Tooling -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Google Fonts for AEX Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet">

  <style>
    /* ───── AEX Design System Typography ───── */
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Oswald', sans-serif; }
    .font-accent { font-family: 'Playfair Display', serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #ebedea; }
    ::-webkit-scrollbar-thumb { background: #3F556B; }

    @keyframes animationIn {
      0% { opacity: 0; transform: translateY(30px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
    }

    .animate-on-scroll { animation-play-state: paused !important; }
    .animate-on-scroll.animate { animation-play-state: running !important; }

    html, body {
      overflow-x: hidden !important;
      min-height: 100% !important;
      scroll-behavior: auto !important;
    }

    /* ───── Abstract Editorial Background ───── */
    .hero-bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .bg-base { position: absolute; inset: 0; background: #ebedea; }
    .bg-layers { position: absolute; inset: 0; filter: blur(60px); }
    .layer { position: absolute; border-radius: 50%; opacity: 0.7; mix-blend-mode: multiply; }
    .layer-1 { width: 600px; height: 600px; background: #f2f2f2; top: 10%; left: 15%; animation: float1 28s ease-in-out infinite alternate; }
    .layer-2 { width: 500px; height: 500px; background: #eaeaea; top: 40%; left: 55%; animation: float2 32s ease-in-out infinite alternate; }
    .layer-3 { width: 700px; height: 700px; background: #f5f5f5; top: 60%; left: 20%; animation: float3 36s ease-in-out infinite alternate; }
    
    @keyframes float1 { 0% { transform: translate(0px, 0px) scale(1); } 100% { transform: translate(40px, -30px) scale(1.05); } }
    @keyframes float2 { 0% { transform: translate(0px, 0px) scale(1); } 100% { transform: translate(-30px, 40px) scale(1.08); } }
    @keyframes float3 { 0% { transform: translate(0px, 0px) scale(1); } 100% { transform: translate(20px, 30px) scale(1.04); } }
    
    .bg-noise { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.055; mix-blend-mode: multiply; }
  </style>
</head>

<body class="bg-[#ebedea] text-[#2d322f] antialiased selection:bg-[#3F556B] selection:text-white overflow-x-hidden">

  <!-- Navegação Topo (Design System Pattern) -->
  <header class="fixed top-0 inset-x-0 w-full border-b border-[#2d322f]/10 bg-[#ebedea]/60 backdrop-blur-xl z-50">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
      <!-- Logo Esquerda -->
      <div class="flex justify-start items-center">
        <a href="index.html" class="shrink-0 group flex items-center">
          <img src="Muriel_nome.png" alt="Muriel Logo"
            class="h-4 md:h-5 opacity-80 group-hover:opacity-100 transition-all duration-300 filter brightness-0">
        </a>
      </div>

      <!-- Links & Interações Direita -->
      <div class="flex justify-end items-center gap-10">
        <nav class="hidden md:flex justify-end gap-10">
          <a href="muriel-documenta.html"
            class="relative group text-xs font-bold text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Documenta<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#pos"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Pós<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#casulo"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Casulo<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#quem-somos"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Quem
            Somos<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
        </nav>

        <button aria-label="Menu" class="md:hidden text-[#2d322f] hover:text-[#3F556B] transition-colors duration-300">
          <iconify-icon height="24" icon="solar:hamburger-menu-linear" width="24"></iconify-icon>
        </button>
      </div>
    </div>
  </header>

  <main class="relative min-h-[90vh] lg:min-h-screen w-full bg-[#ebedea] text-[#2d322f] overflow-hidden pb-24 lg:pb-32">
    <!-- Organic Editorial Background (Canvas Native) -->
    <div class="hero-bg">
      <div class="bg-base"></div>
      <div class="bg-layers">
        <div class="layer layer-1"></div>
        <div class="layer layer-2" style="background: #3F556B; opacity: 0.15; top: 30%; left: 60%;"></div>
        <div class="layer layer-3" style="background: #ffffff; width: 800px; height: 800px; opacity: 0.8; top: -20%; left: -10%;"></div>
      </div>
      <canvas class="bg-noise"></canvas>
    </div>

    <!-- The Box-Busting Layout -->
    <div class="relative z-10 w-full h-full max-w-[1400px] mx-auto px-6 lg:px-12 flex flex-col justify-center pt-32 lg:pt-48">
      
      <!-- Label -->
      <div class="flex items-center gap-4 mb-8 lg:mb-16 animate-on-scroll [animation:animationIn_1.2s_ease-out_0.1s_both]">
        <div class="w-12 lg:w-16 h-[2px] bg-[#3F556B]"></div>
        <span class="font-sans text-xs md:text-sm font-bold uppercase tracking-[0.25em] text-[#3F556B]">Diagnóstico Narrativo</span>
      </div>

      <!-- Main Question -->
      <h1 class="relative font-display text-[4rem] md:text-[6.5rem] lg:text-[8.5rem] xl:text-[10rem] font-bold tracking-tighter uppercase text-[#1e2420] leading-[0.85] w-full flex flex-col z-20">
        <span class="animate-on-scroll [animation:animationIn_1.2s_ease-out_0.2s_both] text-left">Sua marca <span class="italic font-accent normal-case font-normal text-[#3F556B]">sustenta</span></span>
        <span class="animate-on-scroll [animation:animationIn_1.2s_ease-out_0.4s_both] flex items-center justify-end w-full mt-2 lg:mt-4">
          <span class="italic font-accent normal-case font-normal text-[#1e2420]">um documentário?</span>
        </span>
      </h1>

      <!-- The Twist & Subtitle -->
      <div class="mt-16 lg:mt-24 w-full flex flex-col lg:flex-row items-center justify-between gap-16 lg:gap-8 relative z-30">
        
        <!-- Or Just Content? Massive Box Offset -->
        <div class="w-full lg:w-[45%] relative animate-on-scroll [animation:animationIn_1.2s_ease-out_0.6s_both]">
          <!-- Shadow anchor -->
          <div class="absolute inset-0 bg-[#3F556B] translate-x-4 translate-y-4 lg:translate-x-6 lg:translate-y-6 -z-10 transition-transform duration-500 hover:translate-x-2 hover:translate-y-2"></div>
          
          <div class="relative bg-[#1e2420] text-white p-12 lg:p-14 xl:p-16 shadow-[0_30px_60px_rgba(0,0,0,0.4)] group overflow-hidden border border-[#3F556B]/30 cursor-default">
            <!-- Sweep highlight hover -->
            <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-[150%] group-hover:translate-x-[150%] transition-transform duration-[1.2s] ease-in-out"></div>
            
            <h2 class="font-display text-5xl md:text-6xl lg:text-[4.5rem] xl:text-[5.5rem] uppercase font-bold tracking-tighter leading-[0.9] mb-0 relative z-10 w-full">
              <span class="text-white/40 font-light tracking-tight">Ou</span> <span class="italic font-accent normal-case text-white">só</span> <br>
              <span class="text-[#ebedea] underline decoration-2 underline-offset-4 decoration-[#3F556B] group-hover:decoration-white transition-colors duration-500">conteúdo?</span>
            </h2>
            
            <div class="absolute bottom-0 right-0 p-6 transform group-hover:scale-110 transition-transform duration-500 z-10 hidden sm:block">
              <iconify-icon icon="solar:camera-minimalistic-linear" width="80" height="80" class="text-[#3F556B] opacity-20 group-hover:opacity-40 transition-opacity duration-300"></iconify-icon>
            </div>
          </div>
        </div>

        <!-- Details & CTA -->
        <div class="w-full lg:w-[50%] flex flex-col items-start lg:pl-16 relative">
          
          <p class="font-sans text-xl lg:text-[1.7rem] font-light text-[#2d322f] leading-relaxed mb-10 animate-on-scroll [animation:animationIn_1.2s_ease-out_0.7s_both]">
            Diagnóstico concreto para identificar o 
            <span class="font-bold relative inline-block text-[#1e2420] px-1">
              potencial narrativo atual
              <span class="absolute bottom-1 left-0 w-full h-[8px] bg-[#3F556B]/30 -z-10"></span>
            </span> 
            da sua marca – e como transformá-lo em valor.
          </p>
          
          <a href="#solicitar" class="group relative flex items-center justify-center bg-[#1e2420] text-white px-10 py-5 lg:px-12 lg:py-6 overflow-hidden animate-on-scroll [animation:animationIn_1.2s_ease-out_0.9s_both] w-full md:w-auto shadow-[0_20px_40px_rgba(30,36,32,0.3)]">
            <span class="absolute inset-0 bg-[#3F556B] -translate-x-[101%] group-hover:translate-x-0 transition-transform duration-[600ms] ease-[cubic-bezier(0.19,1,0.22,1)] z-0"></span>
            
            <div class="relative z-10 flex items-center gap-4 text-xs lg:text-sm font-semibold uppercase tracking-[0.2em] group-hover:text-white transition-colors duration-300">
              SOLICITAR DIAGNÓSTICO NARRATIVO
              <iconify-icon icon="solar:arrow-right-up-linear" width="24" height="24" class="group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform duration-300"></iconify-icon>
            </div>
          </a>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Smooth Scroll System via Lenis
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      gestureDirection: 'vertical',
      smooth: true,
      mouseMultiplier: 1,
      smoothTouch: false,
      touchMultiplier: 2,
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Intersection Observer for Animate On Scroll
    (function () {
      const once = true;
      if (!window.__inViewIO) {
        window.__inViewIO = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("animate");
              if (once) window.__inViewIO.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: "0px 0px -10% 0px" });
      }
      window.initInViewAnimations = function (selector = ".animate-on-scroll") {
        document.querySelectorAll(selector).forEach((el) => {
          window.__inViewIO.observe(el);
        });
      };
      document.addEventListener("DOMContentLoaded", () => initInViewAnimations());
    })();

    // Editorial Grain (Noise)
    const canvas = document.querySelector('.bg-noise');
    if (canvas) {
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth / 2;
        canvas.height = window.innerHeight / 2;
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      function renderNoise() {
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const buffer = new Uint32Array(imageData.data.buffer);

        for (let i = 0; i < buffer.length; i++) {
          const val = Math.random() * 255 | 0;
          buffer[i] =
            (255 << 24) |
            (val << 16) |
            (val << 8) |
            val;
        }

        ctx.putImageData(imageData, 0, 0);
      }

      function loopNoise() {
        renderNoise();
        requestAnimationFrame(loopNoise);
      }

      loopNoise();
    }
  </script>
</body>
</html>
