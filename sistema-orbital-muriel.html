<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Orbital Muriel™ | Muriel Filmes</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- Google Fonts for AEX Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', sans-serif;
    }

    .font-accent {
      font-family: 'Playfair Display', serif;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e2420;
    }
    ::-webkit-scrollbar-thumb {
      background: #3F556B;
    }

    @keyframes animationIn {
      0% { opacity: 0; transform: translateY(30px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
    }
    
    @keyframes fadeIn {
      0% { opacity: 0; filter: blur(15px); scale: 1.05; }
      100% { opacity: 1; filter: blur(0px); scale: 1; }
    }

    .animate-in {
      animation: animationIn 1.5s cubic-bezier(0.19, 1, 0.22, 1) both;
    }

    .fade-in {
      animation: fadeIn 2s cubic-bezier(0.19, 1, 0.22, 1) both;
    }

    html, body {
      overflow-x: hidden !important;
      min-height: 100% !important;
      background: #1e2420;
      color: #ebedea;
    }
    
    .bg-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.055;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>

<body class="bg-[#1e2420] text-[#ebedea] antialiased selection:bg-[#3F556B] selection:text-white">
  <!-- Canvas Noise Global -->
  <canvas class="bg-noise"></canvas>

  <!-- Navegação Topo (Cópia exata e ativa) -->
  <header class="fixed top-0 inset-x-0 w-full border-b border-[#2d322f]/10 bg-[#ebedea]/60 backdrop-blur-xl z-50">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
      <!-- Logo Esquerda -->
      <div class="flex justify-start items-center">
        <a href="index.html" class="shrink-0 group flex items-center">
          <img src="Muriel_nome.png" alt="Muriel Logo"
            class="h-4 md:h-5 opacity-80 group-hover:opacity-100 transition-all duration-300 filter brightness-0">
        </a>
      </div>

      <!-- Links & Interações Direita -->
      <div class="flex justify-end items-center gap-10">
        <nav class="hidden md:flex justify-end gap-10">
          <a href="muriel-documenta.html"
            class="relative group text-xs font-bold text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Documenta<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#pos"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Pós<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#casulo"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Casulo<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#quem-somos"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Quem
            Somos<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#contato"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Contato<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
        </nav>

        <button aria-label="Menu" class="md:hidden text-[#2d322f] hover:text-[#3F556B] transition-colors duration-300">
          <iconify-icon height="24" icon="solar:hamburger-menu-linear" width="24"></iconify-icon>
        </button>
      </div>
    </div>
  </header>

  <main class="relative min-h-screen w-full flex items-center justify-center pt-20 pb-20 overflow-hidden bg-[#3F556B]">
    
    <!-- Fundo Grid Matrix Editorial (Dark) -->
    <div class="absolute inset-0 z-0 pointer-events-none mix-blend-overlay opacity-[0.08]"
      style="background-image: linear-gradient(rgba(235, 237, 234, 0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(235, 237, 234, 0.5) 1px, transparent 1px); background-size: 80px 80px;">
    </div>

    <!-- Efeitos Orbitais e Fundo Cinematográfico -->
    <div class="absolute inset-0 z-0 flex items-center justify-center overflow-hidden fade-in pointer-events-none select-none">

      <!-- Círculo Orbital 1 (Borda Externa Larga) -->
      <div class="absolute w-[180vw] md:w-[110vw] aspect-square rounded-full border border-[#ebedea]/20 animate-[spin_80s_linear_infinite]">
        <!-- Ponto Orbital -->
        <div class="absolute top-0 left-[20%] w-2 h-2 md:w-3 md:h-3 rounded-full bg-[#1e2420] border-2 border-[#ebedea] -translate-x-1/2 -translate-y-1/2 shadow-[0_0_20px_rgba(235,237,234,0.5)]"></div>
        <div class="absolute left-0 top-[80%] w-[1px] h-[30px] bg-gradient-to-b from-[#ebedea]/60 to-transparent"></div>
      </div>

      <!-- Círculo Orbital 2 (Intermediário Tracejado) -->
      <div class="absolute w-[120vw] md:w-[75vw] aspect-square rounded-full border-[1px] border-dashed border-[#ebedea]/20 animate-[spin_50s_linear_infinite_reverse]">
        <!-- Ponto Orbital Múltiplo -->
        <div class="absolute top-[14%] right-[14%] w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-white shadow-[0_0_20px_#ffffff]"></div>
        <div class="absolute bottom-[10%] left-[20%] w-[8px] h-[8px] border-2 border-[#ebedea] rotate-45 flex items-center justify-center">
            <div class="w-1 h-1 bg-[#ebedea] opacity-50"></div>
        </div>
      </div>

      <!-- Círculo Orbital 3 (Interno Precisão) -->
      <div class="absolute w-[80vw] md:w-[45vw] aspect-square rounded-full border-[2px] border-[#ebedea]/30 animate-[spin_30s_linear_infinite] shadow-[0_0_50px_rgba(235,237,234,0.15)] flex items-center justify-center">
        <!-- Calibradores de Alta Precisão -->
        <div class="absolute top-0 w-[2px] h-6 bg-[#ebedea] shadow-[0_0_15px_rgba(235,237,234,0.6)]"></div>
        <div class="absolute bottom-0 w-[2px] h-6 bg-[#ebedea] shadow-[0_0_15px_rgba(235,237,234,0.6)]"></div>
        <div class="absolute left-0 h-[2px] w-6 bg-[#ebedea] shadow-[0_0_15px_rgba(235,237,234,0.6)]"></div>
        <div class="absolute right-0 h-[2px] w-6 bg-[#ebedea] shadow-[0_0_15px_rgba(235,237,234,0.6)]"></div>
      </div>
      
      <!-- Linhas de Construção Cinematográficas -->
      <div class="absolute w-full h-[1px] bg-gradient-to-r from-transparent via-[#ebedea]/30 to-transparent top-1/2 -translate-y-1/2"></div>
      <div class="absolute h-full w-[1px] bg-gradient-to-b from-transparent via-[#ebedea]/30 to-transparent left-1/2 -translate-x-1/2"></div>
    </div>

    <!-- Container de Conteúdo -->
    <div class="relative z-10 max-w-[1400px] mx-auto w-full px-6 lg:px-12 flex flex-col items-center justify-center text-center mt-12 md:mt-0">
      
      <!-- Label Header -->
      <div class="flex items-center gap-4 animate-in relative backdrop-blur-sm bg-[#1e2420]/40 px-5 py-2 rounded-full border border-[#ebedea]/30 shadow-[0_4px_30px_rgba(0,0,0,0.3)]" style="animation-delay: 0.3s;">
        <div class="w-1.5 h-1.5 rounded-full bg-[#ebedea] animate-pulse"></div>
        <span class="font-sans text-[10px] md:text-xs font-bold uppercase tracking-[0.25em] text-[#ebedea] drop-shadow-md">Metodologia Muriel</span>
      </div>

      <!-- Título Monumental -->
      <div class="mt-8 mb-10 md:mb-12 relative animate-in" style="animation-delay: 0.5s;">
        <!-- Tipografia "Sistema" translúcida no fundo de escala gigante -->
        <h1 class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 font-display text-[7rem] sm:text-[10rem] md:text-[14rem] lg:text-[20rem] uppercase font-bold tracking-tighter opacity-[0.025] text-white whitespace-nowrap select-none pointer-events-none mix-blend-screen">SISTEMA</h1>
        
        <h2 class="relative z-10 font-display text-[4rem] sm:text-[5rem] md:text-[7rem] lg:text-[9rem] uppercase font-bold tracking-tighter leading-[0.85] text-white drop-shadow-[0_15px_30px_rgba(0,0,0,0.5)] flex flex-col items-center">
          <span class="block relative group pb-2">
            <span class="relative z-10 text-transparent bg-clip-text bg-gradient-to-b from-white to-[#ebedea]/60">Sistema</span>
          </span>
          <span class="block mt-0 relative group flex items-center justify-center gap-3 lg:gap-5 flex-wrap">
            <span class="italic font-accent normal-case font-extralight text-[#1e2420] drop-shadow-[0_0_15px_rgba(30,36,32,0.5)] animate-[pulse_4s_infinite_alternate]">Orbital</span>
            <span class="relative z-10 text-white">Muriel<span class="text-[0.5em] align-super">™</span></span>
          </span>
        </h2>
      </div>

      <!-- Descrição (Texto fornecido) -->
      <div class="max-w-[1100px] w-full mx-auto animate-in relative z-20" style="animation-delay: 0.7s;">
        <div class="absolute inset-0 bg-[#1e2420]/30 backdrop-blur-2xl -z-10 rounded-[2rem] scale-110 opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
        <p class="font-sans text-[1.15rem] sm:text-[1.35rem] md:text-[1.85rem] lg:text-[2.15rem] font-light text-[#ebedea]/70 leading-[1.6] md:leading-[1.7] tracking-tight text-center">
          <span class="block">
            <strong class="font-display font-medium text-[#1e2420] uppercase tracking-widest text-[1.05em] relative inline-block mx-1 drop-shadow-[0_0_8px_rgba(235,237,234,0.3)]">
              Documentários de marca
              <span class="absolute bottom-[-2px] left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-[#1e2420]/80 to-transparent"></span>
            </strong>
             inspiram, engajam e entretêm
          </span>
          <span class="block mt-1 md:mt-2">
            por meio de <span class="italic font-accent text-[1.15em] text-[#ebedea] font-normal px-1 drop-shadow-[0_0_15px_rgba(235,237,234,0.4)]">narrativas complexas</span> que criam
          </span>
          <span class="block mt-1 md:mt-2">
            uma conexão duradoura com o <strong class="font-display font-medium uppercase tracking-widest text-[1.05em] text-[#ebedea] bg-[#1e2420] py-1 px-3 ml-2 shadow-[0_4px_15px_rgba(30,36,32,0.6)] rounded-sm inline-block transform -rotate-1 border border-[#2d322f]/50">público.</strong>
          </span>
        </p>
      </div>

      <!-- Call To Action -->
      <div class="mt-16 md:mt-24 lg:mt-32 animate-in relative z-30" style="animation-delay: 0.9s;">
        <a href="#diagnostico" class="group relative inline-flex items-center justify-between bg-[#ebedea] text-[#1e2420] overflow-hidden px-8 py-5 lg:px-12 xl:py-6 border border-transparent shadow-[0_20px_50px_rgba(0,0,0,0.6)] hover:shadow-[0_20px_70px_rgba(30,36,32,0.4)] transition-shadow duration-700">
          
          <!-- Background Swipe Escuro/Azul Metálico -->
          <span class="absolute inset-0 w-full h-full bg-[#1e2420] transform scale-x-0 origin-right group-hover:scale-x-100 transition-transform duration-[800ms] ease-[cubic-bezier(0.19,1,0.22,1)] z-0"></span>
          
          <span class="relative z-10 font-sans font-bold text-xs lg:text-sm uppercase tracking-[0.25em] group-hover:text-white transition-colors duration-500 pr-10 md:pr-14 text-left leading-tight text-[#131715]">
            Diagnosticar Meu Projeto
          </span>
          
          <div class="relative z-10 w-10 h-10 md:w-12 md:h-12 flex items-center justify-center bg-[#131715] text-[#ebedea] rounded-full group-hover:bg-white group-hover:text-[#131715] transition-all duration-500 shrink-0 transform group-hover:scale-90">
            <iconify-icon icon="solar:arrow-right-up-linear" width="22" class="transform group-hover:rotate-45 transition-transform duration-500"></iconify-icon>
          </div>
        </a>
      </div>
      
    </div>
    
    <!-- Hint de Scroll -->
    <div onclick="const next = document.querySelector('section'); if(next) next.scrollIntoView({ behavior: 'smooth' })" class="absolute bottom-6 md:bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-80 hover:opacity-100 transition-opacity cursor-pointer animate-in z-50" style="animation-delay: 1.5s;">
      <span class="font-sans text-[10px] uppercase tracking-[0.2em] text-[#ebedea] font-semibold">Explore</span>
      <iconify-icon class="animate-bounce text-white" icon="solar:arrow-down-linear"></iconify-icon>
    </div>
    
  </main>

</body>
</html>
