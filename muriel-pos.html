<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muriel Pós | Muriel Filmes</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Google Fonts for AEX Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Oswald', sans-serif; }
    .font-accent { font-family: 'Playfair Display', serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #ebedea; }
    ::-webkit-scrollbar-thumb { background: #3F556B; }
    html, body { overflow-x: hidden !important; min-height: 100% !important; scroll-behavior: auto !important; }

    @keyframes animationIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
    }

    .animate-on-scroll {
      animation-play-state: paused !important;
    }

    .animate-on-scroll.animate {
      animation-play-state: running !important;
    }

    /* ───── Abstract Editorial Background ───── */
    .hero-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bg-base {
      position: absolute;
      inset: 0;
      background: #ebedea;
    }
    .bg-layers {
      position: absolute;
      inset: 0;
      filter: blur(60px);
    }
    .layer {
      position: absolute;
      border-radius: 50%;
      opacity: 0.7;
      mix-blend-mode: multiply;
    }
    .layer-1 {
      width: 600px;
      height: 600px;
      background: #f2f2f2;
      top: 10%;
      left: 15%;
      animation: float1 28s ease-in-out infinite alternate;
    }
    .layer-2 {
      width: 500px;
      height: 500px;
      background: #eaeaea;
      top: 40%;
      left: 55%;
      animation: float2 32s ease-in-out infinite alternate;
    }
    .layer-3 {
      width: 700px;
      height: 700px;
      background: #f5f5f5;
      top: 60%;
      left: 20%;
      animation: float3 36s ease-in-out infinite alternate;
    }
    @keyframes float1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.05); }
    }
    @keyframes float2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-30px, 40px) scale(1.08); }
    }
    @keyframes float3 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(20px, 30px) scale(1.04); }
    }
    .bg-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.055;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body class="bg-[#ebedea] text-[#2d322f] antialiased selection:bg-[#3F556B] selection:text-white overflow-x-hidden">
  <header class="fixed top-0 inset-x-0 w-full border-b border-[#2d322f]/10 bg-[#ebedea]/60 backdrop-blur-xl z-50">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
      <div class="flex justify-start items-center">
        <a href="index.html" class="shrink-0 group flex items-center">
          <img src="Muriel_nome.png" alt="Muriel Logo" class="h-4 md:h-5 opacity-80 group-hover:opacity-100 transition-all duration-300 filter brightness-0">
        </a>
      </div>
      <div class="flex justify-end items-center gap-10">
        <nav class="hidden md:flex justify-end gap-10">
          <a href="muriel-documenta.html" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Documenta<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="muriel-pos.html" class="relative group text-xs font-bold text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Pós<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#casulo" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Casulo<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#quem-somos" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Quem Somos<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#contato" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Contato<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
        </nav>
        <button aria-label="Menu" class="md:hidden text-[#2d322f] hover:text-[#3F556B] transition-colors duration-300">
          <iconify-icon height="24" icon="solar:hamburger-menu-linear" width="24"></iconify-icon>
        </button>
      </div>
    </div>
  </header>

  <main class="relative min-h-screen w-full flex items-center justify-center pt-20 pb-20 overflow-hidden" id="hero">
    <!-- Abstract Editorial Background -->
    <div class="hero-bg">
      <div class="bg-base"></div>
      <div class="bg-layers">
        <div class="layer layer-1"></div>
        <div class="layer layer-2"></div>
        <div class="layer layer-3"></div>
      </div>

      <!-- Logo Watermark GIGANTE -->
      <div class="absolute top-[50%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[140vw] md:w-[100vw] lg:w-[75vw] max-w-[1600px] flex justify-center opacity-[0.068] pointer-events-none select-none z-[5]">
        <img src="./Muriel_Pos_logo.png" alt="Muriel Pós Watermark" class="w-full h-auto object-contain filter brightness-0">
      </div>

      <canvas class="bg-noise"></canvas>
    </div>

    <div class="relative z-10 max-w-[1400px] mx-auto w-full px-6 lg:px-12 flex flex-col items-start lg:pt-16">
      


      <!-- Headline -->
      <h1 class="font-display text-[3.5rem] md:text-[5.5rem] lg:text-[7rem] xl:text-[8rem] uppercase font-bold tracking-tighter leading-[0.85] text-[#2d322f] w-full max-w-[1250px] relative">
        <div class="flex flex-col lg:gap-2 relative z-10">
          <span class="block animate-on-scroll [animation:animationIn_1.2s_ease-out_0.3s_both] text-[#3F556B]">Pós-produção</span>
          <span class="block animate-on-scroll [animation:animationIn_1.2s_ease-out_0.4s_both] text-[#2d322f]/80">orientada por <span class="font-accent italic font-normal text-[#3F556B] lowercase relative inline-block group cursor-default">arquitetura narrativa<span class="absolute bottom-2 lg:bottom-4 left-0 w-full h-[4px] md:h-[6px] bg-[#3F556B]/30 group-hover:h-full transition-all duration-500 -z-10 group-hover:bg-[#3F556B]/20"></span></span></span>
          <span class="block animate-on-scroll [animation:animationIn_1.2s_ease-out_0.5s_both] text-[#2d322f] flex items-center flex-wrap gap-4 lg:gap-6 mt-2">
            <span class="hidden md:block w-12 md:w-20 lg:w-32 h-[4px] md:h-[6px] bg-[#3F556B] mt-2 lg:mt-4"></span>
            e acabamento <span class="text-[#3F556B]">cinematográfico.</span>
          </span>
        </div>
      </h1>

      <!-- Divider & Description Row -->
      <div class="w-full flex flex-col lg:flex-row items-start lg:items-end justify-between gap-12 mt-20 lg:mt-32 pt-12 relative">
        
        <!-- Top border -->
        <div class="absolute top-0 left-0 h-[1px] bg-[#2d322f]/20 w-full animate-on-scroll [animation:animationIn_1.2s_ease-out_0.6s_both]"></div>

        <div class="flex gap-6 lg:gap-8 max-w-[700px] animate-on-scroll [animation:animationIn_1.2s_ease-out_0.6s_both]">
          <!-- Decorative bracket -->
          <div class="w-1 h-auto bg-gradient-to-b from-[#3F556B] to-transparent shrink-0"></div>
          
          <p class="font-sans text-[1.2rem] md:text-[1.5rem] font-light text-[#2d322f]/70 leading-[1.6]">
            Editamos e finalizamos vídeos com <strong class="font-semibold text-[#1e2420]">excelência técnica</strong>, <strong class="font-semibold text-[#1e2420]">coerência estratégica</strong> e <strong class="font-semibold text-[#1e2420]">aderência absoluta aos prazos</strong>.
          </p>
        </div>

        <div class="w-full lg:w-auto animate-on-scroll [animation:animationIn_1.2s_ease-out_0.7s_both]">
          <a href="#orcamento" class="group relative flex items-center justify-center bg-[#2d322f] text-white px-8 py-5 md:px-12 md:py-6 overflow-hidden w-full sm:w-auto shrink-0 shadow-[0_20px_40px_rgba(45,50,47,0.15)] hover:shadow-[0_10px_20px_rgba(45,50,47,0.2)] transition-all duration-500 border border-[#2d322f] hover:border-[#3F556B]">
            <span class="absolute inset-0 bg-[#3F556B] translate-y-[101%] group-hover:translate-y-0 transition-transform duration-[600ms] ease-[cubic-bezier(0.19,1,0.22,1)] z-0"></span>
            <div class="relative z-10 flex items-center gap-4 text-xs font-bold uppercase tracking-[0.2em] group-hover:text-white transition-colors duration-300">
              Quero Fazer um Orçamento
              <iconify-icon icon="solar:arrow-right-up-linear" width="20" height="20" class="group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform duration-300"></iconify-icon>
            </div>
          </a>
        </div>

      </div>
    </div>

    <!-- Scroll Hint bottom -->
    <div onclick="const next = document.querySelector('section, footer'); if(next) next.scrollIntoView({ behavior: 'smooth' })"
      class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-80 hover:opacity-100 transition-opacity cursor-pointer z-50 [animation:animationIn_0.8s_ease-out_1.2s_both]">
      <span class="text-[10px] uppercase tracking-[0.2em] text-[#3F556B] font-semibold">Explore</span>
      <iconify-icon class="animate-bounce text-[#2d322f]" icon="solar:arrow-down-linear" width="24" height="24"></iconify-icon>
    </div>
  </main>
  
  <footer class="relative w-full pt-20 pb-16 bg-[#1e2420] text-[#ebedea] overflow-hidden border-t border-white/10">
    <div class="relative z-10 max-w-[1400px] mx-auto px-6 lg:px-12 flex flex-col md:flex-row items-center md:items-end justify-between gap-16 md:gap-12 mt-8 lg:mt-16">
      <div class="text-center md:text-left flex flex-col items-center md:items-start group">
        <h3 class="font-display text-5xl lg:text-7xl font-semibold tracking-tighter uppercase mb-6 text-[#ebedea]">
          Muriel <span class="font-accent italic font-normal normal-case text-[#3F556B] mr-1">Pós</span><span class="text-[#3F556B]">.</span>
        </h3>
      </div>
    </div>
  </footer>
  <script>
    // Smooth Scroll System via Lenis
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      gestureDirection: 'vertical',
      smooth: true,
      mouseMultiplier: 1,
      smoothTouch: false,
      touchMultiplier: 2,
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Intersection Observer for Animate On Scroll
    (function () {
      const once = true;
      if (!window.__inViewIO) {
        window.__inViewIO = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("animate");
              if (once) window.__inViewIO.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: "0px 0px -10% 0px" });
      }
      window.initInViewAnimations = function (selector = ".animate-on-scroll") {
        document.querySelectorAll(selector).forEach((el) => {
          window.__inViewIO.observe(el);
        });
      };
      document.addEventListener("DOMContentLoaded", () => initInViewAnimations());
    })();

    // Editorial Grain
    const canvas = document.querySelector('.bg-noise');
    if (canvas) {
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth / 2;
        canvas.height = window.innerHeight / 2;
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      function renderNoise() {
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const buffer = new Uint32Array(imageData.data.buffer);

        for (let i = 0; i < buffer.length; i++) {
          const val = Math.random() * 255 | 0;
          buffer[i] =
            (255 << 24) |
            (val << 16) |
            (val << 8) |
            val;
        }

        ctx.putImageData(imageData, 0, 0);
      }

      function loopNoise() {
        renderNoise();
        requestAnimationFrame(loopNoise);
      }

      loopNoise();
    }
  </script>
</body>
</html>
