<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muriel Pós | Muriel Filmes</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Google Fonts for AEX Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Oswald', sans-serif; }
    .font-accent { font-family: 'Playfair Display', serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #ebedea; }
    ::-webkit-scrollbar-thumb { background: #3F556B; }
    html, body { overflow-x: hidden !important; min-height: 100% !important; scroll-behavior: auto !important; }

    /* ───── Abstract Editorial Background ───── */
    .hero-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bg-base {
      position: absolute;
      inset: 0;
      background: #ebedea;
    }
    .bg-layers {
      position: absolute;
      inset: 0;
      filter: blur(60px);
    }
    .layer {
      position: absolute;
      border-radius: 50%;
      opacity: 0.7;
      mix-blend-mode: multiply;
    }
    .layer-1 {
      width: 600px;
      height: 600px;
      background: #f2f2f2;
      top: 10%;
      left: 15%;
      animation: float1 28s ease-in-out infinite alternate;
    }
    .layer-2 {
      width: 500px;
      height: 500px;
      background: #eaeaea;
      top: 40%;
      left: 55%;
      animation: float2 32s ease-in-out infinite alternate;
    }
    .layer-3 {
      width: 700px;
      height: 700px;
      background: #f5f5f5;
      top: 60%;
      left: 20%;
      animation: float3 36s ease-in-out infinite alternate;
    }
    @keyframes float1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.05); }
    }
    @keyframes float2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-30px, 40px) scale(1.08); }
    }
    @keyframes float3 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(20px, 30px) scale(1.04); }
    }
    .bg-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.055;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body class="bg-[#ebedea] text-[#2d322f] antialiased selection:bg-[#3F556B] selection:text-white overflow-x-hidden">
  <header class="fixed top-0 inset-x-0 w-full border-b border-[#2d322f]/10 bg-[#ebedea]/60 backdrop-blur-xl z-50">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
      <div class="flex justify-start items-center">
        <a href="index.html" class="shrink-0 group flex items-center">
          <img src="Muriel_nome.png" alt="Muriel Logo" class="h-4 md:h-5 opacity-80 group-hover:opacity-100 transition-all duration-300 filter brightness-0">
        </a>
      </div>
      <div class="flex justify-end items-center gap-10">
        <nav class="hidden md:flex justify-end gap-10">
          <a href="muriel-documenta.html" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Documenta<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="muriel-pos.html" class="relative group text-xs font-bold text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Pós<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#casulo" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel Casulo<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#quem-somos" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Quem Somos<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#contato" class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Contato<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
        </nav>
        <button aria-label="Menu" class="md:hidden text-[#2d322f] hover:text-[#3F556B] transition-colors duration-300">
          <iconify-icon height="24" icon="solar:hamburger-menu-linear" width="24"></iconify-icon>
        </button>
      </div>
    </div>
  </header>

  <main class="relative min-h-screen w-full flex items-center justify-center pt-20 pb-20 overflow-hidden" id="hero">
    <!-- Abstract Editorial Background -->
    <div class="hero-bg">
      <div class="bg-base"></div>
      <div class="bg-layers">
        <div class="layer layer-1"></div>
        <div class="layer layer-2"></div>
        <div class="layer layer-3"></div>
      </div>

      <!-- Logo Watermark GIGANTE -->
      <div class="absolute top-[50%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[140vw] md:w-[100vw] lg:w-[75vw] max-w-[1600px] flex justify-center opacity-[0.068] pointer-events-none select-none z-[5]">
        <img src="./Muriel_Pos_logo.png" alt="Muriel Pós Watermark" class="w-full h-auto object-contain filter brightness-0">
      </div>

      <canvas class="bg-noise"></canvas>
    </div>

    <div class="relative z-10 max-w-[1400px] mx-auto w-full px-6 flex flex-col items-center text-center">
      <div class="flex items-center gap-4 relative backdrop-blur-sm bg-[#1e2420]/5 px-5 py-2 rounded-full border border-[#1e2420]/10 mb-8">
        <div class="w-1.5 h-1.5 rounded-full bg-[#3F556B] animate-pulse"></div>
        <span class="font-sans text-[10px] md:text-xs font-bold uppercase tracking-[0.25em] text-[#1e2420]">Em Breve</span>
      </div>
      <h1 class="font-display text-[4rem] sm:text-[6rem] md:text-[8rem] uppercase font-bold tracking-tighter leading-none text-[#2d322f] mb-6">
        MURIEL <span class="font-accent italic text-[#3F556B] font-light lowercase">pós</span>
      </h1>
      <p class="font-sans text-[1.1rem] md:text-[1.3rem] font-light text-[#2d322f]/70 max-w-2xl">
        Página provisoriamente vazia. Em breve, novas informações sobre a pós-produção da Muriel.
      </p>
    </div>
  </main>
  
  <footer class="relative w-full pt-20 pb-16 bg-[#1e2420] text-[#ebedea] overflow-hidden border-t border-white/10">
    <div class="relative z-10 max-w-[1400px] mx-auto px-6 lg:px-12 flex flex-col md:flex-row items-center md:items-end justify-between gap-16 md:gap-12 mt-8 lg:mt-16">
      <div class="text-center md:text-left flex flex-col items-center md:items-start group">
        <h3 class="font-display text-5xl lg:text-7xl font-semibold tracking-tighter uppercase mb-6 text-[#ebedea]">
          Muriel <span class="font-accent italic font-normal normal-case text-[#3F556B] mr-1">Pós</span><span class="text-[#3F556B]">.</span>
        </h3>
      </div>
    </div>
  </footer>
  <script>
    // Editorial Grain
    const canvas = document.querySelector('.bg-noise');
    if (canvas) {
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth / 2;
        canvas.height = window.innerHeight / 2;
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      function renderNoise() {
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const buffer = new Uint32Array(imageData.data.buffer);

        for (let i = 0; i < buffer.length; i++) {
          const val = Math.random() * 255 | 0;
          buffer[i] =
            (255 << 24) |
            (val << 16) |
            (val << 8) |
            val;
        }

        ctx.putImageData(imageData, 0, 0);
      }

      function loopNoise() {
        renderNoise();
        requestAnimationFrame(loopNoise);
      }

      loopNoise();
    }
  </script>
</body>
</html>
