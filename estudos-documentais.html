<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudos Documentais | Muriel Documenta</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lenis via CDN -->
  <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>

  <!-- Tooling -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Google Fonts for AEX Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', sans-serif;
    }

    .font-accent {
      font-family: 'Playfair Display', serif;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e2420;
    }

    ::-webkit-scrollbar-thumb {
      background: #3F556B;
    }

    @keyframes animationIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
    }

    .animate-on-scroll {
      animation-play-state: paused !important;
    }

    .animate-on-scroll.animate {
      animation-play-state: running !important;
    }

    html,
    body {
      overflow-x: hidden !important;
      min-height: 100% !important;
      scroll-behavior: auto !important;
    }

    .bg-noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.055;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>

<body class="bg-[#1e2420] text-[#ebedea] antialiased selection:bg-[#3F556B] selection:text-white overflow-x-hidden">

  <!-- Canvas Noise Global -->
  <canvas class="bg-noise"></canvas>

  <!-- Navegação Topo (Cópia exata e ativa) -->
  <header class="fixed top-0 inset-x-0 w-full border-b border-[#2d322f]/10 bg-[#ebedea]/60 backdrop-blur-xl z-50">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
      <!-- Logo Esquerda -->
      <div class="flex justify-start items-center">
        <a href="index.html" class="shrink-0 group flex items-center">
          <img src="Muriel_nome.png" alt="Muriel Logo"
            class="h-4 md:h-5 opacity-80 group-hover:opacity-100 transition-all duration-300 filter brightness-0">
        </a>
      </div>

      <!-- Links & Interações Direita -->
      <div class="flex justify-end items-center gap-10">
        <nav class="hidden md:flex justify-end gap-10">
          <a href="muriel-documenta.html"
            class="relative group text-xs font-bold text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Documenta<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#pos"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Pós<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#casulo"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Muriel
            Casulo<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
          <a href="index.html#quem-somos"
            class="relative group text-xs font-semibold text-[#2d322f]/70 hover:text-[#3F556B] transition-colors duration-300 uppercase tracking-[0.15em] py-2 whitespace-nowrap">Quem
            Somos<span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#3F556B] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span></a>
        </nav>

        <button aria-label="Menu" class="md:hidden text-[#2d322f] hover:text-[#3F556B] transition-colors duration-300">
          <iconify-icon height="24" icon="solar:hamburger-menu-linear" width="24"></iconify-icon>
        </button>
      </div>
    </div>
  </header>

  <!-- HERO da Subpágina de Estudos -->
  <main class="relative min-h-screen w-full flex items-center justify-center pt-32 pb-24 overflow-hidden">
     <!-- Efeitos de Fundo -->
     <div class="absolute inset-0 bg-[url('city-network.png')] bg-cover bg-center opacity-[0.05] mix-blend-screen pointer-events-none z-0"></div>
     <div class="absolute top-[20%] right-[-10%] w-[800px] h-[800px] bg-[#3F556B]/20 rounded-full blur-[150px] pointer-events-none z-0"></div>
     
     <div class="relative z-10 max-w-[1400px] mx-auto px-6 lg:px-12 w-full flex flex-col items-center text-center">
        <!-- Label -->
        <div class="flex items-center justify-center gap-4 mb-8 [animation:animationIn_1.2s_ease-out_both] delay-100">
           <div class="w-12 md:w-16 h-[2px] bg-[#3F556B]"></div>
           <span class="font-sans text-xs md:text-sm font-bold uppercase tracking-[0.25em] text-[#3F556B]">Índice Operacional 01</span>
           <div class="w-12 md:w-16 h-[2px] bg-[#3F556B]"></div>
        </div>

        <!-- Headline -->
        <h1 class="font-display text-[4.5rem] md:text-[6.5rem] lg:text-[8.5rem] font-bold tracking-tighter uppercase leading-[0.8] text-white [animation:animationIn_1.2s_ease-out_both] delay-300 z-10 relative">
           Estudos <br>
           <span class="italic font-accent normal-case font-normal text-[#3F556B]">Documentais</span>
        </h1>
        
        <!-- Descrição -->
        <p class="font-sans text-lg lg:text-xl font-light text-[#ebedea]/60 max-w-2xl mt-12 [animation:animationIn_1.2s_ease-out_both] delay-500 leading-relaxed">
           Em breve. Uma imersão profunda no arsenal narrativo e nas metodologias arquiteturais da Muriel.
        </p>

        <!-- CTA Back -->
        <a href="muriel-documenta.html" class="mt-16 group relative flex items-center justify-center bg-[#ebedea] text-[#1e2420] px-10 py-5 lg:px-12 lg:py-6 overflow-hidden [animation:animationIn_1.2s_ease-out_both] delay-700 shadow-[0_20px_40px_rgba(0,0,0,0.3)]">
           <span class="absolute inset-0 bg-[#3F556B] -translate-x-[101%] group-hover:translate-x-0 transition-transform duration-[600ms] ease-[cubic-bezier(0.19,1,0.22,1)] z-0"></span>
           <div class="relative z-10 flex items-center gap-4 text-xs font-semibold uppercase tracking-[0.2em] group-hover:text-white transition-colors duration-300">
              <iconify-icon icon="solar:arrow-left-down-linear" width="24" height="24" class="group-hover:-translate-x-1 group-hover:-translate-y-1 transition-transform duration-300"></iconify-icon>
              Retornar para o Índice
           </div>
        </a>
     </div>
  </main>

  <script>
    // Smooth Scroll Lenis Setup
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      gestureDirection: 'vertical',
      smooth: true,
      mouseMultiplier: 1,
      smoothTouch: false,
      touchMultiplier: 2,
      infinite: false,
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Noise Generator
    const canvas = document.querySelector('.bg-noise');
    const ctx = canvas.getContext('2d');
    const generateNoise = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const idata = ctx.createImageData(canvas.width, canvas.height);
      const buffer32 = new Uint32Array(idata.data.buffer);
      const len = buffer32.length;
      for (let i = 0; i < len; i++) {
        if (Math.random() < 0.1) buffer32[i] = 0xff000000;
      }
      ctx.putImageData(idata, 0, 0);
    };
    generateNoise();
    window.addEventListener('resize', generateNoise);
  </script>
</body>
</html>
